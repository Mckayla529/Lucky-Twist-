/mckayla-elements.jpeg" width="1824" height="1368" clip-path="url(#body-clip)"/><image href="../assets/mckayla-elements.jpeg" width="1824" height="1368" clip-path="url(#mount-clip)"/></svg><div class="hand-title">Life is a Twist</div><div class="reels hand-reels"><div class="reel"><div class="strip"></div></div><div class="reel"><div class="strip"></div></div><div class="reel"><div class="strip"></div></div></div><button class="lever hand-lever" id="lever" aria-label="Pull the lever to spin" title="Click to spin"><svg viewBox="1308 460 86 250" aria-hidden="true"><defs><clipPath id="separate-lever-clip"><path d="M1315 484Q1318 461 1349 463Q1383 462 1386 490Q1389 514 1361 523L1339 699Q1334 705 1322 700L1331 518Q1313 508 1315 484Z"/></clipPath></defs><image href="../assets/mckayla-elements.jpeg" width="1824" height="1368" clip-path="url(#separate-lever-clip)"/></svg></button><svg class="lever-joint" viewBox="1216 716 40 104" aria-hidden="true"><defs><clipPath id="mount-silhouette"><path d="M1216 716 1231 716 1233 733 1245 732 1254 740 1257 788 1249 803 1232 806 1231 817 1216 820Z"/></clipPath></defs><image href="../assets/mckayla-elements.jpeg" width="1824" height="1368" clip-path="url(#mount-silhouette)"/></svg></div><div class="result" id="result" role="status" aria-live="polite">What will you create next?<span>READY WHEN YOU ARE</span></div><div class="key">Click the lever or press <kbd>Enter ↵</kbd> to spin</div><button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="true">Sound: On</button><span class="audio-hint" id="audio-hint" role="status"></span><section class="element-menu" aria-label="Element collection"><h2>A collection of possibilities</h2><div id="element-list"></div></section></main><script src="../assets/twist-audio.js?v=16"></script><script>const groups=[{"name": "Messages & Signals", "items": ["Letter", "Clock", "Bell", "Ticket Stub", "Signpost"]}, {"name": "Precious Objects", "items": ["Gemstone", "Pearl", "Crown", "Key"]}, {"name": "Nature", "items": ["Vine", "Fruit", "Flower", "Butterfly", "Insect", "Mushroom", "Leaf", "Feather", "Unusual Plant"]}, {"name": "Childhood", "items": ["Doll", "Rocking Horse", "Kite", "Bubble", "Paper Airplane"]}, {"name": "Surprise & Discovery", "items": ["Gift Box", "Treasure Chest", "Letter"]}];

const symbols=[...new Set(groups.flatMap(g=>g.items))];
const strips=[...document.querySelectorAll('.strip')];
const lever=document.getElementById('lever'),result=document.getElementById('result');
const userIconCells={"Letter": [339.3, 178.3, 122.4, 122.4], "Clock": [571.8, 191.3, 104.4, 104.4], "Bell": [795.6, 185.1, 100.8, 100.8], "Ticket Stub": [1015.3, 184.8, 110.4, 110.4], "Signpost": [1241.7, 187.2, 111.6, 111.6], "Gemstone": [1463.3, 186.3, 110.4, 110.4], "Pearl": [146.5, 480.5, 60.0, 60.0], "Crown": [347.6, 465.6, 94.8, 94.8], "Key": [797.7, 468.7, 93.6, 93.6], "Vine": [1006.2, 456.7, 129.6, 129.6], "Fruit": [1241.8, 459.3, 104.4, 104.4], "Flower": [1464.1, 458.1, 124.8, 124.8], "Butterfly": [119.8, 737.8, 104.4, 104.4], "Insect": [341.4, 736.4, 109.2, 109.2], "Mushroom": [567.4, 735.4, 109.2, 109.2], "Leaf": [780.7, 741.7, 105.6, 105.6], "Feather": [993.8, 726.8, 140.4, 140.4], "Unusual Plant": [1229.0, 731.5, 120.0, 120.0], "Doll": [1476.1, 744.6, 82.8, 82.8], "Rocking Horse": [117.3, 1013.3, 110.4, 110.4], "Kite": [339.6, 1008.6, 142.8, 142.8], "Bubble": [570.5, 1010.5, 108.0, 108.0], "Paper Airplane": [788.0, 1008.5, 114.0, 114.0], "Gift Box": [1012.6, 1005.6, 118.8, 118.8], "Treasure Chest": [1463.2, 1011.2, 111.6, 111.6]};
const elementIcon=name=>`<svg class="element-icon user-icon" viewBox="${userIconCells[name].join(' ')}" aria-hidden="true"><image href="../assets/mckayla-element-icons.jpeg" width="1680" height="1320"/></svg>`;
const symbol=name=>{const longest=Math.max(...name.split(' ').map(word=>word.length));return `<div class="symbol word-symbol ${longest>=9?'long-word':longest>=7?'medium-word':''}" data-element="${name}">${elementIcon(name)}<span>${name}</span></div>`};
let busy=false,count=0;
strips.forEach((strip,i)=>strip.innerHTML=symbol(['Letter','Butterfly','Key'][i]));
document.getElementById('element-list').innerHTML=groups.map(g=>`<div class="element-group"><h3>${g.name}</h3><div class="element-items">${g.items.map(name=>`<div class="element-item">${elementIcon(name)}<span>${name}</span></div>`).join('')}</div></div>`).join('');
const index=n=>{const a=new Uint32Array(1);const ceiling=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=ceiling);return a[0]%n};
const random=()=>symbols[index(symbols.length)];
function draw(){const pool=[...symbols];return Array.from({length:3},()=>pool.splice(index(pool.length),1)[0])}
async function play(){
 if(busy)return;busy=true;window.twistSound.begin();count++;lever.disabled=true;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 lever.classList.add('pulled');setTimeout(()=>lever.classList.remove('pulled'),950);
 result.textContent='An idea is taking shape…';
 const final=draw();
 try{
 await new Promise(resolve=>setTimeout(resolve,1000));window.twistSound.spin();
 await Promise.all(strips.map(async(strip,i)=>{
  const previous=strip.lastElementChild.dataset.element;
  const sequence=[previous,...Array.from({length:24+i*7},random),final[i]];
  strip.innerHTML=sequence.map(symbol).join('');
  const height=strip.parentElement.getBoundingClientRect().height;
  strip.querySelectorAll('.symbol').forEach(el=>el.style.height=height+'px');
  const animation=strip.animate([{transform:'translateY(0)'},{transform:`translateY(-${(sequence.length-1)*height}px)`}],{duration:reduced?150:1800+i*550,easing:'cubic-bezier(.12,.65,.16,1)',fill:'forwards'});
  await animation.finished;strip.innerHTML=symbol(final[i]);animation.cancel();
 }));
 window.twistSound.finish();result.textContent=final.join(' + ');
 const sub=document.createElement('span');sub.textContent=`Twist ${count} · Let these three elements spark your next design.`;result.append(sub);
 }finally{busy=false;lever.disabled=false;}
}
lever.addEventListener('click',play);
